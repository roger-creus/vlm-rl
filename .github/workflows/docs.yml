name: Docs deploy

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.10"
      - name: Install deps
        run: uv sync --extra dev --no-install-project
      - name: mkdocs gh-deploy
        run: uv run mkdocs gh-deploy --force
