name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.10"
      - name: Install deps (core only, CPU-safe)
        run: |
          uv sync --extra dev --no-install-project
          uv pip install -e . --no-deps
      - name: Ruff
        run: uv run --no-env-file ruff check .
      - name: Ruff format check
        run: uv run --no-env-file ruff format --check .
      - name: Pyright
        run: uv run --no-env-file pyright src/cleanrl_vlm
      - name: CPU-safe tests
        run: uv run --no-env-file pytest tests/test_imports.py tests/unit tests/invariants -v

  tier1-smoke:
    name: Tier-1 smoke (GPU)
    runs-on: [self-hosted, gpu]
    if: false   # enable once a self-hosted GPU runner is registered for this repo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          uv sync --extra dev
          uv pip install flash-attn==2.7.4.post1 --no-build-isolation
      - name: Tier-1 smoke
        run: uv run --no-env-file pytest -m tier1 -v
        timeout-minutes: 20
