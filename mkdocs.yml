site_name: cleanrl-vlm
site_description: Online RL finetuning of Vision-Language Models in interactive visual environments.
repo_url: https://github.com/roger-creus/cleanrl-vlm
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      accent: indigo

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - Algorithms: ALGORITHMS.md
  - Environments: ENVS.md
  - Backbones: BACKBONES.md
  - Recipes: RECIPES.md
  - Results: RESULTS.md
  - Research: RESEARCH.md
  - Invariants: INVARIANTS.md
  - Checkpointing: CHECKPOINTING.md
  - Logging: LOGGING.md
  - Contributing: CONTRIBUTING.md
  - Troubleshooting: TROUBLESHOOTING.md
