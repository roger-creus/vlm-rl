compute_environment: LOCAL_MACHINE
distributed_type: DEEPSPEED
mixed_precision: bf16
downcast_bf16: 'no'
num_machines: 1
num_processes: 4
use_cpu: false
debug: true
deepspeed_config:
  # --- ZeRO config ---
  zero_optimization:
    stage: 3
    offload_optimizer:
      device: "cpu"           # offload optimizer state to CPU
      pin_memory: true
    offload_param:
      device: "cpu"           # offload parameter shards to CPU
      pin_memory: true
    overlap_comm: true
    contiguous_gradients: true
    reduce_bucket_size: 5e8   # tune: lower if you see other mem issues
    allgather_bucket_size: 5e8
    stage3_prefetch_bucket_size: 5e7
    stage3_param_persistence_threshold: 1e6
  # --- activation checkpointing to save activation memory ---
  activation_checkpointing:
    # Enable activation checkpointing in DeepSpeed
    partition_activations: true
    contiguous_memory_optimization: true
    cpu_checkpointing: true
  bf16:
    enabled: true             # set to false if switching to fp16
  gradient_clipping: 0.5