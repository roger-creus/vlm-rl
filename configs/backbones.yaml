Qwen/Qwen3.5-0.8B:
  # Debug / fast-smoke tier. Hybrid Gated-DeltaNet + sparse MoE; hidden 1024,
  # 24 layers, vision hidden 768. Matches master-spec §3's architecture
  # pattern for the "Tier-1 0.8B" slot.
  tier: 1
  auto_class: AutoModelForImageTextToText
  processor_pixel_budget:
    # Backbone default; per-env YAML overrides via processor_min_pixels / processor_max_pixels.
    min_pixels: 262144
    max_pixels: 1310720
  attn_implementation: flash_attention_2
  dtype: float16
  thinking_mode: off
  lora_groups_default: [text_attn, text_mlp, vision_attn, vision_mlp, merger, lm_head]
  lora_rank: 32
  lora_alpha: 64

